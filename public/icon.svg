<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#181c24" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="#272d3b" stroke-width="8" filter="url(#shadow)" />

  <!-- Dynamic Payoff Wing Geometries (Subtle Background) -->
  <path d="M 80 340 L 180 240 L 256 190 L 332 240 L 432 340" fill="none" stroke="#222836" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 120 370 L 210 280 L 256 240 L 302 280 L 392 370" fill="none" stroke="#1d2330" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram A -->
  <path d="M 140 330 L 220 150 L 260 150 L 210 330 Z" fill="url(#gold)" />
  <polygon points="182,250 256,250 246,280 174,280" fill="#0c0e12" />

  <!-- Monogram V -->
  <path d="M 270 150 L 310 150 L 380 330 L 340 330 Z" fill="url(#gold)" />
  <path d="M 230 150 L 312 342 L 322 342 L 340 300 L 270 150 Z" fill="url(#gold)" opacity="0.9" />

  <!-- Live Pulse Alpha Pip -->
  <circle cx="396" cy="120" r="24" fill="url(#emerald)" stroke="#0c0e12" stroke-width="8" />
  <circle cx="396" cy="120" r="10" fill="#ecfdf5" />
</svg>
